name: Deploy to GitHub Pages2

on:
  push:
    branches: [dev] # Oder master, je nachdem wie dein Hauptbranch heißt

# Erlaubt dem Workflow, auf GitHub Pages zu schreiben
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass mehrere Deployments gleichzeitig laufen
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite baut standardmäßig in diesen Ordner

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
